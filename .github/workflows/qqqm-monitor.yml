name: QQQM急跌 + TQQQ买卖点监控

on:
  # ------------------------------------------------------------
  # QQQM盘中13%急跌：美东交易时段内约每5分钟检查一次
  # ------------------------------------------------------------
  schedule:
    - cron: '*/5 9-15 * * 1-5'
      timezone: 'America/New_York'

    # ----------------------------------------------------------
    # 每天北京时间08:00：
    # 1) TQQQ收盘买卖点检查
    # 2) 若正好是下个月首个美国交易日的北京时间08:00，发送上月QQQM月线报告
    # ----------------------------------------------------------
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'

  workflow_dispatch:
    inputs:
      mode:
        description: '手动运行模式'
        required: true
        default: 'daily_close'
        type: choice
        options:
          - daily_close
          - qqqm_intraday
          - test_email

jobs:
  # ============================================================
  # 邮箱测试
  # ============================================================
  email_test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test_email' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: 测试QQ邮箱
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          msg = EmailMessage()
          msg['Subject'] = 'QQQM + TQQQ自动监控：邮箱测试成功'
          msg['From'] = sender
          msg['To'] = ', '.join(receivers)
          msg.set_content(
              'QQQM + TQQQ 自动监控邮件链路正常。\n\n'
              '本次仅测试邮箱，不检查市场，也不会产生交易信号。'
          )
          with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
              server.login(sender, password)
              server.send_message(msg)
          print('✅ 邮箱测试成功')
          PY

  # ============================================================
  # QQQM：盘中13%急跌报警
  # ============================================================
  qqqm_intraday:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/5 9-15 * * 1-5')
      ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'qqqm_intraday')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: qqqm-intraday-alert
      cancel-in-progress: false

    steps:
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: 确定本月状态缓存键
        id: state_key
        run: |
          echo "month=$(TZ=America/New_York date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: 恢复本月QQQM急跌报警状态
        id: restore_state
        uses: actions/cache/restore@v4
        with:
          path: .monitor_state
          key: qqqm-acute-${{ steps.state_key.outputs.month }}

      - name: 检查QQQM盘中13%急跌
        id: run_check
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import json
          import os
          import smtplib
          from datetime import datetime
          from email.message import EmailMessage

          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests

          TICKER = 'QQQM'
          THRESHOLD = 0.13
          STATE_DIR = '.monitor_state'
          STATE_FILE = os.path.join(STATE_DIR, 'qqqm_acute_alert.json')

          # QQQM V5.6月度定投金额
          # 按上个月完整月末收盘相对于完整月线的位置确定下月基础定投金额。
          BASE_MONTHLY_BUY = 800.0
          MONTHLY_BUY_RULES = {
              "above_m5": 800.0,
              "m5_to_m10": 1300.0,
              "m10_to_m20": 1800.0,
              "m20_to_m30": 2500.0,
              "below_m30": 3000.0,
          }

          def output(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
                  f.write(f'{name}={value}\n')

          output('triggered', 'false')

          # 已经报警过：本月不重复报警
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, 'r', encoding='utf-8') as f:
                      state = json.load(f)
                  if state.get('alerted'):
                      print('✅ 本月QQQM 13%急跌已经报警过，不重复发送。')
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception:
                  pass

          now_utc = pd.Timestamp.now(tz='UTC')
          et = 'America/New_York'
          now_et = now_utc.tz_convert(et)
          nyse = xcals.get_calendar('XNYS')

          # 找到今天美股正式交易时段
          today = now_et.strftime('%Y-%m-%d')
          sched = nyse.schedule.loc[today:today]
          if sched.empty:
              print('今天不是NYSE交易日，退出。')
              raise SystemExit(0)

          session = sched.iloc[0]
          market_open = pd.Timestamp(session['open'])
          market_close = pd.Timestamp(session['close'])
          if not (market_open <= now_utc <= market_close):
              print('当前不在NYSE正规交易时段，退出。')
              raise SystemExit(0)

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          def send_email(subject, body):
              msg = EmailMessage()
              msg['Subject'] = subject
              msg['From'] = sender
              msg['To'] = ', '.join(receivers)
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
                  server.login(sender, password)
                  server.send_message(msg)

          def fetch_chart(interval, range_text, host):
              url = f'https://{host}/v8/finance/chart/{TICKER}'
              params = {
                  'range': range_text,
                  'interval': interval,
                  'events': 'div,splits',
                  'includeAdjustedClose': 'true',
                  'includePrePost': 'false',
              }
              session = requests.Session(impersonate='chrome')
              try:
                  r = session.get(url, params=params, timeout=30)
                  r.raise_for_status()
                  payload = r.json()
                  result = payload.get('chart', {}).get('result')
                  if not result:
                      raise RuntimeError('Yahoo返回结果为空')
                  result = result[0]
                  ts = result.get('timestamp', [])
                  quote = result.get('indicators', {}).get('quote', [])
                  if not ts or not quote:
                      raise RuntimeError('Yahoo行情结构异常')
                  q = quote[0]
                  lows = q.get('low', [])
                  opens = q.get('open', [])
                  closes = q.get('close', [])
                  if not (len(ts) == len(lows) == len(opens) == len(closes)):
                      raise RuntimeError('时间与OHLC长度不一致')
                  rows = []
                  tz_name = result.get('meta', {}).get('exchangeTimezoneName', et)
                  for t, o, lo, cl in zip(ts, opens, lows, closes):
                      if cl is None:
                          continue
                      dt = pd.Timestamp(t, unit='s', tz='UTC').tz_convert(tz_name)
                      rows.append({
                          'timestamp': dt,
                          'date': dt.strftime('%Y-%m-%d'),
                          'open': float(o) if o is not None else float('nan'),
                          'low': float(lo) if lo is not None else float('nan'),
                          'close': float(cl),
                      })
                  return pd.DataFrame(rows).sort_values('timestamp').reset_index(drop=True)
              finally:
                  session.close()

          # 日线用于取得本月第一个NYSE交易日开盘价
          daily = None
          last_errors = []
          for host in ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']:
              try:
                  d = fetch_chart('1d', '3mo', host)
                  daily = d
                  print(f'{host}日线读取成功，最新日期：{d.iloc[-1]["date"]}')
                  break
              except Exception as exc:
                  last_errors.append(f'{host}: {exc}')

          if daily is None:
              raise RuntimeError('无法取得QQQM日线数据：' + '；'.join(last_errors))

          current_month = now_et.strftime('%Y-%m')
          month_rows = daily[daily['date'].str.startswith(current_month)].copy()
          if month_rows.empty:
              raise RuntimeError('当前月份尚未取得QQQM日线数据')
          month_open = float(month_rows.iloc[0]['open'])
          trigger_price = month_open * (1 - THRESHOLD)

          # 当前价格提示所使用的月线：只用上一个完整月份及以前的数据。
          def fetch_daily_history():
              errors = []
              for host in ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']:
                  url = f'https://{host}/v8/finance/chart/{TICKER}'
                  params = {
                      'range': '15y',
                      'interval': '1d',
                      'events': 'div,splits',
                      'includeAdjustedClose': 'true',
                      'includePrePost': 'false',
                  }
                  session = requests.Session(impersonate='chrome')
                  try:
                      r = session.get(url, params=params, timeout=25)
                      r.raise_for_status()
                      result = r.json().get('chart', {}).get('result')
                      if not result:
                          raise RuntimeError('Yahoo历史返回为空')
                      result = result[0]
                      ts = result.get('timestamp', [])
                      q = result.get('indicators', {}).get('quote', [{}])[0]
                      op = q.get('open', [])
                      cl = q.get('close', [])
                      if not ts or len(ts) != len(op) or len(ts) != len(cl):
                          raise RuntimeError('Yahoo历史日线结构异常')
                      tzname = result.get('meta', {}).get('exchangeTimezoneName', et)
                      rows = []
                      for t, o, c in zip(ts, op, cl):
                          if c is None:
                              continue
                          dt = pd.Timestamp(t, unit='s', tz='UTC').tz_convert(tzname)
                          rows.append({
                              'date': dt.strftime('%Y-%m-%d'),
                              'open': float(o) if o is not None else float('nan'),
                              'close': float(c),
                          })
                      df = pd.DataFrame(rows).drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)
                      if df.empty:
                          raise RuntimeError('Yahoo历史没有有效数据')
                      return df
                  except Exception as exc:
                      errors.append(f'{host}: {exc}')
                  finally:
                      session.close()
              raise RuntimeError('QQQM历史月线数据获取失败：' + '；'.join(errors))

          history = fetch_daily_history()
          history['month'] = pd.to_datetime(history['date']).dt.to_period('M')
          monthly_close = history.groupby('month')['close'].last().sort_index()
          latest_complete_month = pd.Period(current_month, freq='M') - 1
          monthly_close = monthly_close[monthly_close.index <= latest_complete_month]
          if len(monthly_close) < 60:
              raise RuntimeError('QQQM完整月线不足60个月，无法计算M5/M10/M20/M30/M60。')

          monthly_ma = {n: float(monthly_close.tail(n).mean()) for n in [5, 10, 20, 30, 60]}

          def broken_month_lines(price):
              return [n for n in [5, 10, 20, 30, 60] if price < monthly_ma[n]]

          print('==========================================')
          print('QQQM盘中13%急跌监控')
          print('==========================================')
          print(f'美国东部时间：{now_et.strftime("%Y-%m-%d %H:%M:%S %Z")}')
          print(f'本月首个交易日开盘：{month_open:.2f}')
          print(f'13%触发价格：{trigger_price:.2f}')

          intraday = None
          last_errors = []
          for host in ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']:
              try:
                  d = fetch_chart('1m', '1d', host)
                  intraday = d
                  print(f'{host} 1分钟数据读取成功')
                  break
              except Exception as exc:
                  last_errors.append(f'{host}: {exc}')

          if intraday is None:
              raise RuntimeError('无法取得QQQM盘中1分钟数据：' + '；'.join(last_errors))

          today_rows = intraday[intraday['date'] == today].copy()
          if today_rows.empty:
              print('当前暂无今日正规时段1分钟数据，退出。')
              raise SystemExit(0)

          touched = today_rows[today_rows['low'] <= trigger_price].copy()
          if touched.empty:
              latest = today_rows.iloc[-1]
              print(f'最新1分钟收盘：{latest["close"]:.2f}，尚未触发13%急跌。')
              raise SystemExit(0)

          first_touch = touched.iloc[0]
          first_touch_time = pd.Timestamp(first_touch['timestamp'])
          first_touch_low = float(first_touch['low'])
          latest = today_rows.iloc[-1]
          latest_price = float(latest['close'])
          broken_lines = broken_month_lines(latest_price)
          broken_text = '、'.join(f'M{n}' for n in broken_lines) if broken_lines else '无'

          # 13%急跌邮件同时给出“当前价格所处月线区间对应的V5.6定投金额”。
          # 注意：这里显示的是按当前位置对应的月度定投档位，不代表当月已经正式月末确认。
          if latest_price >= monthly_ma[5]:
              position_buy_amount = MONTHLY_BUY_RULES["above_m5"]
              position_text = f'QQQM ≥ M5 → ${position_buy_amount:,.0f}'
          elif latest_price >= monthly_ma[10]:
              position_buy_amount = MONTHLY_BUY_RULES["m5_to_m10"]
              position_text = f'M5 > QQQM ≥ M10 → ${position_buy_amount:,.0f}'
          elif latest_price >= monthly_ma[20]:
              position_buy_amount = MONTHLY_BUY_RULES["m10_to_m20"]
              position_text = f'M10 > QQQM ≥ M20 → ${position_buy_amount:,.0f}'
          elif latest_price >= monthly_ma[30]:
              position_buy_amount = MONTHLY_BUY_RULES["m20_to_m30"]
              position_text = f'M20 > QQQM ≥ M30 → ${position_buy_amount:,.0f}'
          else:
              position_buy_amount = MONTHLY_BUY_RULES["below_m30"]
              position_text = f'QQQM < M30 → ${position_buy_amount:,.0f}'

          if broken_lines:
              rule_buy_text = (
                  f'当前价格已跌破月线：{broken_text}；'
                  f'按月线位置对应的V5.6定投金额：{position_text}'
              )
          else:
              rule_buy_text = (
                  f'当前价格未跌破M5/M10/M20/M30/M60；'
                  f'按月线位置对应的V5.6定投金额：{position_text}'
              )

          body = (
              'QQQM V5.6 盘中13%急跌报警\n\n'
              f'美国东部时间：{first_touch_time.strftime("%Y-%m-%d %H:%M:%S %Z")}\n'
              f'本月首个交易日开盘：${month_open:.2f}\n'
              f'13%触发价格：${trigger_price:.2f}\n'
              f'首次触发分钟最低价：${first_touch_low:.2f}\n'
              f'当前最近价格：${latest_price:.2f}\n'
              f'当前价格已跌破月线：{broken_text}\n'
              f'按V5.6破线纪律：{rule_buy_text}\n\n'
              '定义：相对当月第一个美股交易日正规交易时段开盘价下跌13%。\n'
              '本月已触发，本程序本月不重复报警。\n\n'
              '请按你的QQQM V5.6纪律处理；本邮件仅负责提醒，不自动下单。'
          )

          send_email('⚠️ QQQM V5.6：盘中13%急跌触发', body)

          os.makedirs(STATE_DIR, exist_ok=True)
          with open(STATE_FILE, 'w', encoding='utf-8') as f:
              json.dump({
                  'alerted': True,
                  'month': current_month,
                  'trigger_time': first_touch_time.isoformat(),
                  'trigger_price': trigger_price,
              }, f, ensure_ascii=False, indent=2)

          output('triggered', 'true')
          print('✅ QQQM 13%急跌报警邮件已发送。')
          PY

      - name: 保存本月QQQM急跌报警状态
        if: ${{ steps.run_check.outputs.triggered == 'true' && steps.restore_state.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .monitor_state
          key: qqqm-acute-${{ steps.state_key.outputs.month }}

  # ============================================================
  # TQQQ：每日收盘买卖点 + QQQM月度报告
  # ============================================================
  daily_close:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 8 * * *')
      ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'daily_close')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: daily-close-monitor
      cancel-in-progress: false

    steps:
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: TQQQ收盘买卖点 + QQQM月度报告
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import os
          import re
          import smtplib
          from email.message import EmailMessage

          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests

          YAHOO_HOSTS = ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']
          PRICE_DIFF_LIMIT = 0.002

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          def send_email(subject, body):
              msg = EmailMessage()
              msg['Subject'] = subject
              msg['From'] = sender
              msg['To'] = ', '.join(receivers)
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
                  server.login(sender, password)
                  server.send_message(msg)

          now_utc = pd.Timestamp.now(tz='UTC')
          now_bj = now_utc.tz_convert('Asia/Shanghai')
          now_et = now_utc.tz_convert('America/New_York')
          nyse = xcals.get_calendar('XNYS')

          # ----------------------------------------------------------
          # 市场日历：最近完整交易日 + 上一交易日 + 下一交易日
          # ----------------------------------------------------------
          start_date = (now_utc - pd.Timedelta(days=20)).strftime('%Y-%m-%d')
          end_date = (now_utc + pd.Timedelta(days=20)).strftime('%Y-%m-%d')
          schedule = nyse.schedule.loc[start_date:end_date]
          if schedule.empty:
              raise RuntimeError('无法取得NYSE交易日历')

          close_col = 'close' if 'close' in schedule.columns else 'market_close'
          completed = schedule[schedule[close_col] <= now_utc]
          if completed.empty:
              raise RuntimeError('没有完整NYSE交易日')

          latest_session = completed.index[-1]
          latest_date = latest_session.strftime('%Y-%m-%d')
          prev_session = completed.index[-2] if len(completed) >= 2 else None
          prev_date = prev_session.strftime('%Y-%m-%d') if prev_session is not None else None

          future_sessions = schedule[schedule.index > latest_session]
          next_session = future_sessions.index[0] if not future_sessions.empty else None
          next_date = next_session.strftime('%Y-%m-%d') if next_session is not None else None

          print('==========================================')
          print('QQQM + TQQQ 每日收盘监控')
          print('==========================================')
          print(f'北京时间：{now_bj.strftime("%Y-%m-%d %H:%M:%S %Z")}')
          print(f'最新完整NYSE交易日：{latest_date}')
          print(f'上一交易日：{prev_date}')
          print(f'下一NYSE交易日：{next_date}')

          def fetch_history(ticker, range_text='15y'):
              errors = []
              good = []
              for host in YAHOO_HOSTS:
                  try:
                      url = f'https://{host}/v8/finance/chart/{ticker}'
                      params = {
                          'range': range_text,
                          'interval': '1d',
                          'events': 'div,splits',
                          'includeAdjustedClose': 'true',
                          'includePrePost': 'false',
                      }
                      session = requests.Session(impersonate='chrome')
                      try:
                          response = session.get(url, params=params, timeout=30)
                          response.raise_for_status()
                          payload = response.json()
                      finally:
                          session.close()

                      result = payload.get('chart', {}).get('result')
                      if not result:
                          raise RuntimeError('Yahoo返回结果为空')
                      result = result[0]
                      ts = result.get('timestamp', [])
                      quote = result.get('indicators', {}).get('quote', [])
                      if not ts or not quote:
                          raise RuntimeError('Yahoo数据结构异常')
                      q = quote[0]
                      op = q.get('open', [])
                      hi = q.get('high', [])
                      lo = q.get('low', [])
                      cl = q.get('close', [])
                      if not (len(ts) == len(op) == len(hi) == len(lo) == len(cl)):
                          raise RuntimeError('时间与OHLC长度不一致')
                      tz_name = result.get('meta', {}).get('exchangeTimezoneName', 'America/New_York')
                      rows = []
                      for t, o, h, l, c in zip(ts, op, hi, lo, cl):
                          if c is None:
                              continue
                          dt = pd.Timestamp(t, unit='s', tz='UTC').tz_convert(tz_name)
                          rows.append({
                              'timestamp': dt,
                              'date': dt.strftime('%Y-%m-%d'),
                              'open': float(o) if o is not None else float('nan'),
                              'high': float(h) if h is not None else float('nan'),
                              'low': float(l) if l is not None else float('nan'),
                              'close': float(c),
                          })
                      df = pd.DataFrame(rows).drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)
                      good.append((host, df))
                  except Exception as exc:
                      errors.append(f'{host}: {exc}')

              if not good:
                  raise RuntimeError(f'{ticker} Yahoo两个入口均失败：' + '；'.join(errors))

              # 如果两个入口都提供了最新完整交易日，交叉校验收盘
              latest_rows = []
              for host, df in good:
                  x = df[df['date'] <= latest_date]
                  if not x.empty:
                      latest_rows.append((host, x.iloc[-1]))

              if len(latest_rows) >= 2 and all(row['date'] == latest_date for _, row in latest_rows[:2]):
                  p1 = float(latest_rows[0][1]['close'])
                  p2 = float(latest_rows[1][1]['close'])
                  diff = abs(p1 - p2) / p1
                  if diff > PRICE_DIFF_LIMIT:
                      raise RuntimeError(f'{ticker} Yahoo双源最新收盘差异过大：{diff*100:.4f}%')

              # 选择最新日期最新的一份
              good.sort(key=lambda item: item[1].iloc[-1]['date'], reverse=True)
              selected_host, selected_df = good[0]
              selected_df = selected_df[selected_df['date'] <= latest_date].copy()
              return selected_host, selected_df

          # ----------------------------------------------------------
          # 1. TQQQ V2.0 收盘信号
          # ----------------------------------------------------------
          tqqq_host, tqqq = fetch_history('TQQQ', '15y')
          if tqqq.iloc[-1]['date'] != latest_date:
              send_email(
                  '⚠️ TQQQ监控：行情数据未更新',
                  (
                      f'北京时间：{now_bj.strftime("%Y-%m-%d %H:%M:%S")}\n'
                      f'最近完整NYSE交易日：{latest_date}\n'
                      f'TQQQ Yahoo最新数据：{tqqq.iloc[-1]["date"]}\n\n'
                      '本次无法可靠计算正式D60交易信号，因此不产生交易指令。'
                  )
              )
              raise RuntimeError(
                  f'TQQQ最新Yahoo数据为 {tqqq.iloc[-1]["date"]}，'
                  f'但最近完整NYSE交易日为 {latest_date}；数据尚未可靠更新。'
              )

          # 月末Close：使用每个自然月最后一个美国交易日的正规收盘价
          tqqq['month'] = pd.to_datetime(tqqq['date']).dt.to_period('M')
          t_monthly = tqqq.groupby('month')['close'].last().sort_index()
          if len(t_monthly) < 61:
              raise RuntimeError('TQQQ有效完整月线不足61个月，无法可靠计算当日M60及上一交易日M60')

          def calc_d60_for_date(date_text):
              row = tqqq[tqqq['date'] == date_text]
              if row.empty:
                  raise RuntimeError(f'TQQQ缺少交易日 {date_text}')
              close = float(row.iloc[-1]['close'])
              month = pd.Period(date_text, freq='M')
              prior_months = t_monthly[t_monthly.index < month].tail(60)
              if len(prior_months) < 60:
                  raise RuntimeError(f'{date_text}计算M60时不足60个完整月')
              m60 = float(prior_months.mean())
              d60 = close / m60 - 1
              return close, m60, d60

          t_close, t_m60, t_d60 = calc_d60_for_date(latest_date)
          p_d60 = None
          if prev_date:
              _, _, p_d60 = calc_d60_for_date(prev_date)

          print('------------------------------------------')
          print(f'TQQQ数据源：{tqqq_host}')
          print(f'TQQQ收盘：{t_close:.2f}')
          print(f'适用M60：{t_m60:.2f}')
          print(f'D60：{t_d60*100:.2f}%')

          buy_levels = [0.00, -0.10, -0.20, -0.30, -0.40]
          sell_levels = [0.50, 1.00, 1.50, 2.00, 2.50]

          def reached_buy_level(d):
              reached = [x for x in buy_levels if d <= x]
              return min(reached) if reached else None

          def reached_sell_level(d):
              reached = [x for x in sell_levels if d >= x]
              return max(reached) if reached else None

          today_buy = reached_buy_level(t_d60)
          prev_buy = reached_buy_level(p_d60) if p_d60 is not None else None
          today_sell = reached_sell_level(t_d60)
          prev_sell = reached_sell_level(p_d60) if p_d60 is not None else None

          new_buy = today_buy is not None and (prev_buy is None or today_buy < prev_buy)
          new_sell = today_sell is not None and (prev_sell is None or today_sell > prev_sell)

          # 如果当天一次跨越多个买档，邮件只报告当天达到的最高买档；卖出同理报告最高累计目标。
          if new_buy:
              level_text = f'{today_buy*100:.0f}%'
              if today_buy == 0:
                  detail = 'D60 首次达到 0% 或更低，进入第一档买入区间。'
              else:
                  detail = f'D60 当日达到 {level_text} 买入档。'
              body = (
                  'TQQQ V2.0 新增买点信号\n\n'
                  f'数据日期：{latest_date}\n'
                  f'TQQQ正式收盘：${t_close:.2f}\n'
                  f'适用M60：${t_m60:.2f}\n'
                  f'D60：{t_d60*100:.2f}%\n\n'
                  f'触发档位：{level_text}\n'
                  f'{detail}\n\n'
                  '说明：本程序不读取你的账户交易记录，因此只报告市场信号，\n'
                  '不判断该档位你以前是否已经执行。请按你的TQQQ V2.0本轮状态自行确认是否执行。\n\n'
                  '下一交易日：若该买入档位本轮尚未执行，按V2.0纪律处理。'
              )
              send_email(f'⚠️ TQQQ V2.0：新买点 {level_text}', body)
              print('✅ 已发送TQQQ买点邮件。')

          elif new_sell:
              level_text = f'+{today_sell*100:.0f}%'
              body = (
                  'TQQQ V2.0 新增卖点信号\n\n'
                  f'数据日期：{latest_date}\n'
                  f'TQQQ正式收盘：${t_close:.2f}\n'
                  f'适用M60：${t_m60:.2f}\n'
                  f'D60：{t_d60*100:.2f}%\n\n'
                  f'达到的最高累计卖出目标：{level_text}\n\n'
                  '说明：本程序不读取你的账户交易记录，因此不计算具体卖出股数。\n'
                  '请按你的TQQQ V2.0本轮状态，用“累计目标 − 已实际卖出比例”确定下一交易日数量。\n\n'
                  '下一交易日：若本轮尚未完成该累计卖出目标，按V2.0纪律执行。'
              )
              send_email(f'⚠️ TQQQ V2.0：新卖点 {level_text}', body)
              print('✅ 已发送TQQQ卖点邮件。')
          else:
              print('ℹ️ 今日TQQQ没有新的买卖档位触发，不发送常规邮件。')

          # ----------------------------------------------------------
          # 2. QQQM：每月一次的月度定投报告
          #
          # 发送条件：
          # 最近完整交易日属于上月的最后一个NYSE交易日，
          # 且下一NYSE交易日对应“今天的北京时间日期”。
          # 这样会在下个月第一个美国交易日开始前最近的北京时间08:00发送，
          # 周末不会重复发送。
          # ----------------------------------------------------------
          qqqm_monthly_report = (
              next_session is not None
              and next_date == now_bj.strftime('%Y-%m-%d')
              and latest_session == schedule.loc[
                  str(pd.Period(latest_date, freq='M')) + '-01':
              ].index[-1]
              and pd.Period(latest_date, freq='M') < pd.Period(now_bj.strftime('%Y-%m'), freq='M')
          )

          if qqqm_monthly_report:
              print('==========================================')
              print('进入QQQM月度报告条件')
              print('==========================================')

              qqqm_host, qqqm = fetch_history('QQQM', '15y')

              # QQQM在月末后早晨有时会出现Yahoo历史接口滞后。
              # 这种情况沿用已经验证过的StockAnalysis内嵌结构化历史数据补齐。
              if qqqm.iloc[-1]['date'] != latest_date:
                  print(
                      f'⚠️ QQQM Yahoo最新为 {qqqm.iloc[-1]["date"]}，'
                      f'目标为 {latest_date}，尝试备用历史源补齐。'
                  )

                  url = 'https://stockanalysis.com/etf/qqqm/history/'
                  session = requests.Session(impersonate='chrome')
                  try:
                      response = session.get(url, timeout=30)
                      response.raise_for_status()
                      html = response.text
                  finally:
                      session.close()

                  number = r'-?(?:\d+(?:\.\d+)?|\.\d+)'
                  pattern = re.compile(
                      rf'\{{a:(?P<a>{number}),c:(?P<c>{number}),h:(?P<h>{number}),l:(?P<l>{number}),o:(?P<o>{number}),t:"(?P<t>\d{{4}}-\d{{2}}-\d{{2}})"'
                  )
                  rows = []
                  for match in pattern.finditer(html):
                      rows.append({
                          'date': match.group('t'),
                          'open': float(match.group('o')),
                          'high': float(match.group('h')),
                          'low': float(match.group('l')),
                          'close': float(match.group('c')),
                      })
                  supplemental = pd.DataFrame(rows).drop_duplicates('date', keep='last').sort_values('date')
                  supplemental = supplemental[supplemental['date'] <= latest_date].copy()
                  if supplemental.empty or supplemental.iloc[-1]['date'] != latest_date:
                      send_email(
                          '⚠️ QQQM月度报告：行情数据未更新',
                          (
                              f'北京时间：{now_bj.strftime("%Y-%m-%d %H:%M:%S")}\n'
                              f'应使用的最后完整交易日：{latest_date}\n'
                              f'Yahoo最新：{qqqm.iloc[-1]["date"]}\n'
                              '备用历史源也未取得最新完整交易日。\n\n'
                              '本次不生成QQQM月度定投结论。'
                          )
                      )
                      raise RuntimeError('QQQM月度报告缺少最新完整交易日数据')

                  missing = supplemental[supplemental['date'] > qqqm.iloc[-1]['date']].copy()
                  qqqm = pd.concat([qqqm, missing], ignore_index=True)
                  qqqm = qqqm.drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)
                  qqqm_host = qqqm_host + ' + StockAnalysis补齐'

              qqqm = qqqm[qqqm['date'] <= latest_date].copy()
              qqqm['month'] = pd.to_datetime(qqqm['date']).dt.to_period('M')
              q_monthly = qqqm.groupby('month')['close'].last().sort_index()

              if len(q_monthly) < 60:
                  raise RuntimeError('QQQM有效完整月线不足60个月')

              report_month = q_monthly.index[-1]
              report_close = float(q_monthly.iloc[-1])

              q_month_df = pd.DataFrame({'Close': q_monthly})
              for n in [5, 10, 20, 30, 60]:
                  q_month_df[f'M{n}'] = q_month_df['Close'].rolling(n).mean()

              report_row = q_month_df.loc[report_month]
              broken = []
              for n in [5, 10, 20, 30, 60]:
                  ma = float(report_row[f'M{n}'])
                  if report_close < ma:
                      broken.append((n, ma))

              # 用户最终确认的QQQM V5.6月度定投金额
              BASE_MONTHLY_BUY = 800.0
              MONTHLY_BUY_RULES = {
                  "above_m5": 800.0,
                  "m5_to_m10": 1300.0,
                  "m10_to_m20": 1800.0,
                  "m20_to_m30": 2500.0,
                  "below_m30": 3000.0,
              }

              # 严格按用户给定区间判断下月基础定投金额。
              # 等号归属：QQQM ≥ M5、M5 > QQQM ≥ M10、M10 > QQQM ≥ M20、
              # M20 > QQQM ≥ M30、QQQM < M30。
              m5 = float(report_row['M5'])
              m10 = float(report_row['M10'])
              m20 = float(report_row['M20'])
              m30 = float(report_row['M30'])

              if report_close >= m5:
                  monthly_amount = MONTHLY_BUY_RULES["above_m5"]
                  position_text = 'QQQM ≥ M5'
              elif report_close >= m10:
                  monthly_amount = MONTHLY_BUY_RULES["m5_to_m10"]
                  position_text = 'M5 > QQQM ≥ M10'
              elif report_close >= m20:
                  monthly_amount = MONTHLY_BUY_RULES["m10_to_m20"]
                  position_text = 'M10 > QQQM ≥ M20'
              elif report_close >= m30:
                  monthly_amount = MONTHLY_BUY_RULES["m20_to_m30"]
                  position_text = 'M20 > QQQM ≥ M30'
              else:
                  monthly_amount = MONTHLY_BUY_RULES["below_m30"]
                  position_text = 'QQQM < M30'

              monthly_amount_text = f'${monthly_amount:,.0f}'

              body_lines = [
                  'QQQM月度定投确认报告',
                  '',
                  f'报告月份：{report_month}',
                  f'上月月末正式收盘：${report_close:.2f}',
                  f'数据源：{qqqm_host}',
                  '',
              ]

              if not broken:
                  body_lines += [
                      '月线结论：未跌破M5/M10/M20/M30/M60。',
                      f'下月QQQM位置：{position_text}。',
                      f'按V5.6纪律：下月基础定投 {monthly_amount_text}。',
                  ]
              else:
                  broken_text = ', '.join(f'M{n}' for n, _ in broken)
                  body_lines += [
                      f'月线结论：已跌破 {broken_text}。',
                      f'最深破线：M{max(n for n, _ in broken)}。',
                      f'QQQM位置档位：{position_text}。',
                      f'按V5.6纪律：下月基础定投 {monthly_amount_text}。',
                  ]

              body_lines += ['', '各月线：']
              for n in [5, 10, 20, 30, 60]:
                  ma = float(report_row[f'M{n}'])
                  diff = report_close / ma - 1
                  status = '破线' if report_close < ma else '未破线'
                  body_lines.append(f'M{n}：${ma:.2f}，收盘相对均线 {diff*100:.2f}%，{status}')

              body_lines += [
                  '',
                  'V5.6定投金额规则：',
                  'QQQM ≥ M5：$800',
                  'M5 > QQQM ≥ M10：$1,300',
                  'M10 > QQQM ≥ M20：$1,800',
                  'M20 > QQQM ≥ M30：$2,500',
                  'QQQM < M30：$3,000',
                  '',
                  '说明：本月度报告只判断上个月正式月线破线情况。',
                  '不考虑上个月盘中是否曾经触发QQQM 13%急跌。',
                  'QQQM盘中13%急跌由独立盘中模块实时监控。',
              ]

              send_email(f'QQQM月度定投确认：{report_month}', '\n'.join(body_lines))
              print('✅ QQQM月度报告已发送。')
          else:
              print('ℹ️ 今天不是QQQM月度报告发送日。')
          PY
