name: QQQM急跌13% + TQQQ交易信号监控

on:
  # QQQM盘中急跌监控：GitHub Actions最短计划间隔为5分钟。
  # Python内部只在NYSE正规交易时段运行。
  schedule:
    - cron: '*/5 9-15 * * 1-5'
      timezone: 'America/New_York'

    # TQQQ每日收盘信号：收盘后留出20分钟给行情源更新。
    - cron: '20 16 * * 1-5'
      timezone: 'America/New_York'

  workflow_dispatch:
    inputs:
      test_email:
        description: '仅测试邮箱，不检查行情'
        required: true
        default: false
        type: boolean
      run_mode:
        description: '手动运行模式'
        required: true
        default: all
        type: choice
        options:
          - all
          - qqqm
          - tqqq

jobs:
  # ================================================================
  # 邮箱测试
  # ================================================================
  email-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email == true }}
    runs-on: ubuntu-latest
    steps:
      - name: 测试QQ邮箱
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          msg = EmailMessage()
          msg['Subject'] = 'QQQM/TQQQ自动监控：邮箱测试成功'
          msg['From'] = sender
          msg['To'] = ', '.join(receivers)
          msg.set_content(
              'QQQM 13%盘中急跌 + TQQQ V2.0交易信号监控的邮件链路测试成功。\n\n'
              '本次仅测试邮箱，不检查QQQM，也不检查TQQQ，不产生交易信号。'
          )
          with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
              server.login(sender, password)
              server.send_message(msg)
          print('✅ 邮箱测试邮件发送成功')
          PY

  # ================================================================
  # QQQM：只监控盘中13%急跌，不发送每日常规报告
  # ================================================================
  qqqm-intraday:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email == true) && (github.event_name != 'workflow_dispatch' || inputs.run_mode == 'all' || inputs.run_mode == 'qqqm') }}
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: QQQM盘中13%急跌监控
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests

          TICKER = 'QQQM'
          DROP = 0.13
          NY_TZ = 'America/New_York'

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          def send_email(subject, body):
              msg = EmailMessage()
              msg['Subject'] = subject
              msg['From'] = sender
              msg['To'] = ', '.join(receivers)
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
                  server.login(sender, password)
                  server.send_message(msg)

          now = pd.Timestamp.now(tz=NY_TZ)
          nyse = xcals.get_calendar('XNYS')

          # 找到今天是否为NYSE交易日，以及当前是否处于正规交易时段
          today = now.strftime('%Y-%m-%d')
          sched = nyse.schedule.loc[today:today]
          if sched.empty:
              print(f'今天 {today} 不是NYSE交易日，跳过QQQM盘中监控。')
              raise SystemExit(0)

          market_open = sched.iloc[0]['open' if 'open' in sched.columns else 'market_open']
          market_close = sched.iloc[0]['close' if 'close' in sched.columns else 'market_close']
          if not (market_open <= now.tz_convert('UTC') < market_close):
              print(f'当前不在NYSE正规交易时段：{now}')
              raise SystemExit(0)

          # 本月第一交易日
          month_start = pd.Timestamp(today).to_period('M').start_time.strftime('%Y-%m-%d')
          sessions = nyse.sessions_in_range(month_start, today)
          if len(sessions) == 0:
              raise RuntimeError('无法取得本月NYSE交易日')
          first_session = sessions[0]
          first_date = first_session.strftime('%Y-%m-%d')

          def yahoo_chart(period1, period2, interval='5m'):
              # query1/query2依次尝试；5分钟级数据只用于盘中预警，不用于收盘正式交易信号。
              errors = []
              for host in ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']:
                  url = f'https://{host}/v8/finance/chart/{TICKER}'
                  params = {
                      'period1': int((pd.Timestamp(period1).tz_convert('UTC') if pd.Timestamp(period1).tzinfo else pd.Timestamp(period1).tz_localize('UTC')).timestamp()),
                      'period2': int((pd.Timestamp(period2).tz_convert('UTC') if pd.Timestamp(period2).tzinfo else pd.Timestamp(period2).tz_localize('UTC')).timestamp()),
                      'interval': interval,
                      'events': 'div,splits',
                      'includeAdjustedClose': 'true',
                  }
                  session = requests.Session(impersonate='chrome')
                  try:
                      resp = session.get(url, params=params, timeout=25)
                      resp.raise_for_status()
                      result = resp.json().get('chart', {}).get('result')
                      if not result:
                          raise RuntimeError('Yahoo返回结果为空')
                      result = result[0]
                      ts = result.get('timestamp', [])
                      quote = result.get('indicators', {}).get('quote', [{}])[0]
                      close = quote.get('close', [])
                      low = quote.get('low', [])
                      opn = quote.get('open', [])
                      if not ts or len({len(ts), len(close), len(low), len(opn)}) != 1:
                          raise RuntimeError('Yahoo盘中数据结构异常')
                      tzname = result.get('meta', {}).get('exchangeTimezoneName', NY_TZ)
                      rows = []
                      for t, o, c, lo in zip(ts, opn, close, low):
                          if c is None:
                              continue
                          dt = pd.Timestamp(t, unit='s', tz='UTC').tz_convert(tzname)
                          rows.append({'timestamp': dt, 'date': dt.strftime('%Y-%m-%d'), 'open': float(o) if o is not None else float('nan'), 'close': float(c), 'low': float(lo) if lo is not None else float('nan')})
                      df = pd.DataFrame(rows).sort_values('timestamp').reset_index(drop=True)
                      if df.empty:
                          raise RuntimeError('Yahoo没有有效盘中数据')
                      return df
                  except Exception as exc:
                      errors.append(f'{host}: {exc}')
                  finally:
                      session.close()
              raise RuntimeError('；'.join(errors))

          # 获取本月第一交易日到当前的5分钟数据。
          start = pd.Timestamp(f'{first_date} 09:25:00', tz=NY_TZ)
          end = now + pd.Timedelta(minutes=1)
          intraday = yahoo_chart(start.isoformat(), end.isoformat(), interval='5m')
          intraday = intraday[intraday['timestamp'].dt.tz_convert(NY_TZ).dt.date <= now.date()].copy()

          # 只保留当前月第一交易日的正规时段，用于确定月初开盘价。
          first_day_bars = intraday[intraday['date'] == first_date].copy()
          first_day_bars = first_day_bars[
              (first_day_bars['timestamp'].dt.hour * 60 + first_day_bars['timestamp'].dt.minute >= 570) &
              (first_day_bars['timestamp'].dt.hour * 60 + first_day_bars['timestamp'].dt.minute < 960)
          ]
          if first_day_bars.empty:
              raise RuntimeError('无法取得本月第一交易日盘中数据，因此无法确认13%急跌基准。')

          first_open = float(first_day_bars.iloc[0]['open'])
          threshold = first_open * (1 - DROP)

          # 当前交易时段的数据只保留09:30之后；取最近两根5分钟K线。
          today_bars = intraday[intraday['date'] == today].copy()
          today_bars = today_bars[
              (today_bars['timestamp'].dt.hour * 60 + today_bars['timestamp'].dt.minute >= 570) &
              (today_bars['timestamp'].dt.hour * 60 + today_bars['timestamp'].dt.minute < 960)
          ]
          if today_bars.empty:
              print('暂无今天盘中数据。')
              raise SystemExit(0)

          latest = today_bars.iloc[-1]
          previous = today_bars.iloc[-2] if len(today_bars) >= 2 else None

          crossed = False
          if float(latest['low']) <= threshold:
              if previous is None or float(previous['close']) > threshold:
                  crossed = True

          print('==========================================')
          print('QQQM盘中13%急跌监控')
          print('==========================================')
          print(f'时间：{now.strftime("%Y-%m-%d %H:%M:%S %Z")}')
          print(f'本月首个交易日：{first_date}')
          print(f'本月首个交易日开盘：{first_open:.2f}')
          print(f'13%急跌触发价：{threshold:.2f}')
          print(f'最新盘中价：{float(latest["close"]):.2f}')
          print(f'最近5分钟最低：{float(latest["low"]):.2f}')
          print(f'本次是否首次向下穿越：{"是" if crossed else "否"}')

          if crossed:
              body = (
                  '⚠️ QQQM盘中13%急跌触发\n\n'
                  f'时间：{now.strftime("%Y-%m-%d %H:%M:%S %Z")}\n'
                  f'本月首个交易日：{first_date}\n'
                  f'本月首个交易日开盘：{first_open:.2f}\n'
                  f'13%触发价格：{threshold:.2f}\n'
                  f'当前盘中价格：{float(latest["close"]):.2f}\n'
                  f'最近5分钟最低：{float(latest["low"]):.2f}\n\n'
                  '已触发QQQM V5.6盘中13%急跌条件。\n'
                  '这是盘中预警，不代表月线破线确认。请按你已经确定的V5.6急跌纪律处理。'
              )
              send_email('⚠️ QQQM V5.6：盘中13%急跌触发', body)
              print('✅ 急跌预警邮件已发送')
          else:
              print('🟢 本次没有新的13%急跌触发，不发送常规邮件。')
          PY

  # ================================================================
  # TQQQ：V2.0只在出现买/卖信号时发邮件
  # ================================================================
  tqqq-close:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_email == true) && (github.event_name != 'workflow_dispatch' || inputs.run_mode == 'all' || inputs.run_mode == 'tqqq') }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: TQQQ V2.0收盘信号检查
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python <<'PY'
          import os
          import re
          import smtplib
          from email.message import EmailMessage

          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests

          TICKER = 'TQQQ'
          YAHOO_HOSTS = ['query1.finance.yahoo.com', 'query2.finance.yahoo.com']
          PRICE_DIFF_LIMIT = 0.002
          NY_TZ = 'America/New_York'
          TRADES_FILE = 'tqqq_trades.csv'

          BUY_LEVELS = [0.00, -0.10, -0.20, -0.30, -0.40]
          SELL_D60_LEVELS = [0.50, 1.00, 1.50, 2.00, 2.50]
          SELL_TARGETS = [0.20, 0.40, 0.60, 0.80, 1.00]
          UNIT_USD = 2000.0
          MAX_USD = 10000.0

          sender = os.environ.get('EMAIL_SENDER', '').strip()
          password = os.environ.get('EMAIL_PASSWORD', '').strip()
          receivers = [x.strip() for x in os.environ.get('EMAIL_RECEIVERS', '').split(',') if x.strip()]
          if not sender or not password:
              raise RuntimeError('EMAIL_SENDER / EMAIL_PASSWORD 未配置')
          if not receivers:
              receivers = [sender]

          def send_email(subject, body):
              msg = EmailMessage()
              msg['Subject'] = subject
              msg['From'] = sender
              msg['To'] = ', '.join(receivers)
              msg.set_content(body)
              with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as server:
                  server.login(sender, password)
                  server.send_message(msg)

          nyse = xcals.get_calendar('XNYS')
          now = pd.Timestamp.now(tz=NY_TZ)
          today = now.strftime('%Y-%m-%d')

          sched = nyse.schedule.loc[(now - pd.Timedelta(days=10)).strftime('%Y-%m-%d'):today]
          if sched.empty:
              print('无法取得NYSE交易日历。')
              raise SystemExit(0)
          completed = sched[sched['close' if 'close' in sched.columns else 'market_close'] <= now.tz_convert('UTC')]
          if completed.empty:
              print('当前没有已完成NYSE交易日。')
              raise SystemExit(0)
          expected_session = completed.index[-1]
          expected_date = expected_session.strftime('%Y-%m-%d')
          previous_session = completed.index[-2] if len(completed) >= 2 else None
          previous_date = previous_session.strftime('%Y-%m-%d') if previous_session is not None else None

          def fetch_yahoo_daily(host):
              url = f'https://{host}/v8/finance/chart/{TICKER}'
              p1 = pd.Timestamp('2010-01-01', tz='UTC')
              p2 = now.tz_convert('UTC') + pd.Timedelta(days=1)
              params = {
                  'period1': int(p1.timestamp()),
                  'period2': int(p2.timestamp()),
                  'interval': '1d',
                  'events': 'div,splits',
                  'includeAdjustedClose': 'true',
              }
              session = requests.Session(impersonate='chrome')
              try:
                  r = session.get(url, params=params, timeout=30)
                  r.raise_for_status()
                  result = r.json().get('chart', {}).get('result')
                  if not result:
                      raise RuntimeError('Yahoo返回结果为空')
                  result = result[0]
                  ts = result.get('timestamp', [])
                  q = result.get('indicators', {}).get('quote', [{}])[0]
                  op, hi, lo, cl = q.get('open', []), q.get('high', []), q.get('low', []), q.get('close', [])
                  if not ts or len({len(ts), len(op), len(hi), len(lo), len(cl)}) != 1:
                      raise RuntimeError('Yahoo日线结构异常')
                  tzname = result.get('meta', {}).get('exchangeTimezoneName', NY_TZ)
                  rows = []
                  for t, o, h, l, c in zip(ts, op, hi, lo, cl):
                      if c is None:
                          continue
                      dt = pd.Timestamp(t, unit='s', tz='UTC').tz_convert(tzname)
                      rows.append({'date': dt.strftime('%Y-%m-%d'), 'open': float(o) if o is not None else float('nan'), 'high': float(h) if h is not None else float('nan'), 'low': float(l) if l is not None else float('nan'), 'close': float(c)})
                  df = pd.DataFrame(rows).drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)
                  if df.empty:
                      raise RuntimeError('Yahoo没有有效TQQQ日线')
                  return df
              finally:
                  session.close()

          sources = {}
          errors = []
          for host in YAHOO_HOSTS:
              try:
                  d = fetch_yahoo_daily(host)
                  d = d[d['date'] <= expected_date].copy()
                  if d.empty:
                      raise RuntimeError('无有效数据')
                  sources[host] = d
                  print(f'{host} 最新：{d.iloc[-1]["date"]} / {d.iloc[-1]["close"]:.4f}')
              except Exception as exc:
                  errors.append(f'{host}: {exc}')

          if not sources:
              raise RuntimeError('两个Yahoo入口均无法获取TQQQ数据；' + '；'.join(errors))

          yahoo_latest = max(d.iloc[-1]['date'] for d in sources.values())

          # StockAnalysis只作为“Yahoo最新日线滞后”的补充，不依赖其完整历史表格。
          supplemental_used = False
          supplemental_close = None
          if yahoo_latest < expected_date:
              url = 'https://stockanalysis.com/etf/tqqq/history/'
              session = requests.Session(impersonate='chrome')
              try:
                  resp = session.get(url, timeout=30)
                  resp.raise_for_status()
                  html = resp.text
                  num = r'-?(?:\d+(?:\.\d+)?|\.\d+)'
                  pattern = re.compile(rf'\{{a:(?P<a>{num}),c:(?P<c>{num}),h:(?P<h>{num}),l:(?P<l>{num}),o:(?P<o>{num}),t:"(?P<t>\d{{4}}-\d{{2}}-\d{{2}})"')
                  matches = list(pattern.finditer(html))
                  if not matches:
                      raise RuntimeError('StockAnalysis页面未找到内嵌TQQQ历史数据')
                  rows = [{'date': m.group('t'), 'open': float(m.group('o')), 'high': float(m.group('h')), 'low': float(m.group('l')), 'close': float(m.group('c'))} for m in matches]
                  sup = pd.DataFrame(rows).drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)
                  sup = sup[sup['date'] <= expected_date]
                  latest = sup.iloc[-1]
                  if latest['date'] != expected_date:
                      raise RuntimeError(f'StockAnalysis也未更新到{expected_date}')
                  supplemental_close = float(latest['close'])
                  supplemental_used = True
                  print(f'StockAnalysis补齐：{expected_date} / {supplemental_close:.4f}')
              finally:
                  session.close()

          # 选择历史数据：以一个Yahoo完整历史为基础；如果Yahoo缺少当天，则只插入补充的当天记录。
          daily = max(sources.values(), key=lambda d: len(d)).copy()
          if supplemental_used:
              daily = pd.concat([
                  daily,
                  pd.DataFrame([{'date': expected_date, 'open': float('nan'), 'high': float('nan'), 'low': float('nan'), 'close': supplemental_close}])
              ], ignore_index=True)
              daily = daily.drop_duplicates('date', keep='last').sort_values('date').reset_index(drop=True)

          current_row = daily[daily['date'] == expected_date]
          if current_row.empty:
              raise RuntimeError(f'无法取得{expected_date}的TQQQ正式收盘')
          current_close = float(current_row.iloc[-1]['close'])

          # 如果两个Yahoo入口都已更新到当天，做最新收盘交叉校验。
          fresh_yahoo = []
          for host, d in sources.items():
              row = d[d['date'] == expected_date]
              if not row.empty:
                  fresh_yahoo.append(float(row.iloc[-1]['close']))
          if len(fresh_yahoo) >= 2:
              diff = abs(fresh_yahoo[0] - fresh_yahoo[1]) / fresh_yahoo[0]
              print(f'Yahoo双源当天收盘差异：{diff * 100:.4f}%')
              if diff > PRICE_DIFF_LIMIT:
                  send_email(
                      '⚠️ TQQQ监控：行情源冲突',
                      f'交易日：{expected_date}\nYahoo两个入口收盘差异：{diff * 100:.4f}%\n本次不产生TQQQ交易信号。'
                  )
                  raise RuntimeError('Yahoo双源价格冲突')

          # ------------------------------------------------------------
          # 构造月末收盘，并计算“每个月适用的M60”
          # M60(month) = 该月开始前最近60个完整月的月末Close平均值。
          # 因此当前月的M60天然不包含当前月，符合V2.0。
          # ------------------------------------------------------------
          daily['month'] = pd.to_datetime(daily['date']).dt.to_period('M')
          monthly_close = daily.groupby('month')['close'].last().sort_index()
          m60_by_month = monthly_close.rolling(60).mean().shift(1)

          def month_m60(month):
              val = m60_by_month.get(month)
              if val is None or pd.isna(val):
                  return None
              return float(val)

          current_month = pd.Period(expected_date, freq='M')
          m60 = month_m60(current_month)
          if m60 is None:
              raise RuntimeError(f'{current_month}之前完整月线不足60个月，无法计算M60')
          d60 = current_close / m60 - 1

          # ------------------------------------------------------------
          # 读取交易记录
          # 文件格式：date,action,shares,price
          # 例如：2026-01-15,buy,100,42.50
          # 买入/卖出均按“上一交易日收盘信号、下一交易日执行”回溯对应档位。
          # ------------------------------------------------------------
          if not os.path.exists(TRADES_FILE):
              print('ℹ️ 未发现tqqq_trades.csv，因此本次只做行情/D60检查，不输出可执行TQQQ信号。')
              print('请将你的真实历史交易记录放入仓库根目录的tqqq_trades.csv。')
              raise SystemExit(0)

          trades = pd.read_csv(TRADES_FILE)
          needed = {'date', 'action', 'shares', 'price'}
          if not needed.issubset(trades.columns):
              raise RuntimeError('tqqq_trades.csv必须包含：date, action, shares, price')
          if trades.empty:
              print('ℹ️ tqqq_trades.csv为空。本次不输出可执行TQQQ信号。')
              raise SystemExit(0)

          trades['date'] = pd.to_datetime(trades['date'], errors='coerce').dt.strftime('%Y-%m-%d')
          trades['action'] = trades['action'].astype(str).str.strip().str.lower()
          trades['shares'] = pd.to_numeric(trades['shares'], errors='coerce')
          trades['price'] = pd.to_numeric(trades['price'], errors='coerce')
          action_map = {'买入':'buy', '买':'buy', 'b':'buy', 'buy':'buy', '卖出':'sell', '卖':'sell', 's':'sell', 'sell':'sell'}
          trades['action'] = trades['action'].map(lambda x: action_map.get(x, x))
          if trades[['date','action','shares','price']].isna().any().any():
              raise RuntimeError('tqqq_trades.csv存在无效日期/数量/价格')
          if (~trades['action'].isin(['buy','sell'])).any():
              raise RuntimeError('tqqq_trades.csv action只能是buy/sell或买入/卖出')
          trades = trades.sort_values('date').reset_index(drop=True)

          trading_dates = sorted(daily['date'].unique())
          prev_map = {trading_dates[i]: trading_dates[i-1] for i in range(1, len(trading_dates))}
          d60_series = {}
          for _, row in daily.iterrows():
              dt = row['date']
              mm = month_m60(pd.Period(dt, freq='M'))
              if mm is not None:
                  d60_series[dt] = float(row['close']) / mm - 1

          # 根据实际交易记录恢复本轮状态。
          holdings = 0.0
          buy_done = set()
          sell_phase = False
          sell_basis = None
          cumulative_sold_shares = 0.0
          round_no = 1
          reconstruction_warnings = []

          def highest_buy_level(d):
              hits = [x for x in BUY_LEVELS if d <= x]
              return max(hits) if hits else None

          def highest_sell_target(d):
              hits = [t for t in SELL_D60_LEVELS if d >= t]
              return max(hits) if hits else None

          for _, tr in trades.iterrows():
              execution_date = tr['date']
              shares = float(tr['shares'])
              if shares <= 0:
                  raise RuntimeError(f'{execution_date} 股数必须大于0')
              signal_date = prev_map.get(execution_date)
              if signal_date is None or signal_date not in d60_series:
                  reconstruction_warnings.append(f'{execution_date}: 无法找到对应的上一交易日D60')
                  signal_d60 = None
              else:
                  signal_d60 = d60_series[signal_date]

              if tr['action'] == 'buy':
                  if sell_phase:
                      reconstruction_warnings.append(f'{execution_date}: 卖出阶段之后又出现买入记录，违反V2.0')
                  if signal_d60 is not None:
                      level = highest_buy_level(signal_d60)
                      if level is not None:
                          buy_done.add(level)
                      else:
                          reconstruction_warnings.append(f'{execution_date}: 买入记录对应日D60={signal_d60*100:.2f}%，未命中买档')
                  holdings += shares

              else:
                  if signal_d60 is None or signal_d60 < 0.50:
                      reconstruction_warnings.append(f'{execution_date}: 卖出记录对应日未达到+50%卖出启动条件')
                  else:
                      sell_phase = True
                      if sell_basis is None:
                          sell_basis = holdings
                      if sell_basis <= 0:
                          reconstruction_warnings.append(f'{execution_date}: 首次卖出时无正持仓，无法建立卖出基准')
                  holdings -= shares
                  cumulative_sold_shares += shares
                  if holdings < -1e-9:
                      raise RuntimeError(f'{execution_date}: 卖出超过实际持仓')
                  holdings = max(0.0, holdings)

                  if signal_d60 is not None and signal_d60 >= 2.50 and holdings <= 1e-9:
                      # +250%目标完成且已实际清仓，本轮结束。
                      round_no += 1
                      buy_done = set()
                      sell_phase = False
                      sell_basis = None
                      cumulative_sold_shares = 0.0

          # 当前状态
          invested_units = len(buy_done)
          unused_dedicated_cash = max(0.0, MAX_USD - invested_units * UNIT_USD) if not sell_phase else max(0.0, MAX_USD - invested_units * UNIT_USD)

          # 当前信号：以今日收盘D60判断，下一交易日执行。
          action = 'none'
          action_text = ''
          next_trade = '不操作'

          if not sell_phase:
              if d60 <= 0:
                  candidate_levels = [x for x in BUY_LEVELS if d60 <= x and x not in buy_done]
                  if candidate_levels:
                      level = max(candidate_levels)
                      action = 'buy'
                      action_text = f'D60 = {d60*100:.2f}%，达到{level*100:.0f}%买入档。'
                      next_trade = f'下一交易日买入${UNIT_USD:,.0f} TQQQ（{level*100:.0f}%档）'
          else:
              if d60 >= 0.50 and holdings > 0:
                  if sell_basis is None:
                      basis = holdings
                      prior_sold_pct = 0.0
                  else:
                      basis = sell_basis
                      prior_sold_pct = cumulative_sold_shares / basis if basis else 0.0
                  target_hits = [t for t in SELL_TARGETS if d60 >= SELL_D60_LEVELS[SELL_TARGETS.index(t)]]
                  target = max(target_hits) if target_hits else None
                  if target is not None:
                      if target > prior_sold_pct + 1e-9:
                          additional_pct = target - prior_sold_pct
                          shares_to_sell = min(holdings, max(0, int(round(basis * additional_pct))))
                          if shares_to_sell > 0:
                              action = 'sell'
                              action_text = f'D60 = {d60*100:.2f}%，达到D60 +{d60*100:.2f}%对应的累计卖出目标{target*100:.0f}%。'
                              next_trade = f'下一交易日卖出 {shares_to_sell} 股 TQQQ'
                          else:
                              action_text = f'D60达到累计卖出目标{target*100:.0f}%，按整股计算本次应卖数量为0。'

          print('==========================================')
          print('TQQQ V2.0收盘检查')
          print('==========================================')
          print(f'数据日期：{expected_date}')
          print(f'TQQQ正式收盘：{current_close:.4f}')
          print(f'适用M60：{m60:.4f}')
          print(f'D60：{d60*100:.2f}%')
          print(f'当前实际持仓：{holdings:.0f}股')
          print(f'已执行买入档位：{sorted([int(x*100) for x in buy_done], reverse=True) if buy_done else "无"}')
          print(f'本轮状态：{"卖出阶段" if sell_phase else "买入/持有阶段"}')
          print(f'本轮预计剩余未投入专用资金：${unused_dedicated_cash:,.0f}')
          if reconstruction_warnings:
              print('⚠️ 交易记录恢复警告：')
              for w in reconstruction_warnings:
                  print(' - ' + w)

          # 无信号不发常规邮件；有信号才通知。
          if action in ('buy', 'sell'):
              body = (
                  'TQQQ V2.0交易信号\n\n'
                  f'数据日期：{expected_date}\n'
                  f'TQQQ正式收盘：${current_close:.4f}\n'
                  f'适用M60：${m60:.4f}\n'
                  f'D60：{d60*100:.2f}%\n\n'
                  f'当前实际持仓：{holdings:.0f}股\n'
                  f'已执行买入档位：{sorted([int(x*100) for x in buy_done], reverse=True) if buy_done else "无"}\n'
                  f'本轮状态：{"卖出阶段" if sell_phase else "买入/持有阶段"}\n\n'
                  f'信号：{action_text}\n\n'
                  f'下一交易日：{next_trade}\n'
              )
              if sell_basis is not None:
                  basis_pct = cumulative_sold_shares / sell_basis if sell_basis else 0.0
                  body += f'卖出基准持仓：{sell_basis:.0f}股\n当前累计实际卖出：{basis_pct*100:.2f}%\n'
              if reconstruction_warnings:
                  body += '\n交易记录恢复警告：\n' + '\n'.join('- ' + w for w in reconstruction_warnings)
              subject = '⚠️ TQQQ V2.0：买入信号' if action == 'buy' else '⚠️ TQQQ V2.0：卖出信号'
              send_email(subject, body)
              print('✅ TQQQ交易信号邮件已发送')
          else:
              print('🟢 今日无新的TQQQ V2.0交易信号，不发送常规邮件。')
          PY
