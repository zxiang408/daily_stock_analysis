name: QQQM破线监控

on:
  schedule:
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'

  workflow_dispatch:
    inputs:
      test_email:
        description: '仅测试邮箱，不检查QQQM'
        required: true
        default: false
        type: boolean

jobs:
  monitor:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: 安装Python依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi exchange_calendars

      - name: QQQM数据检查与破线监控
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          TEST_EMAIL: ${{ inputs.test_email }}

        run: |
          python <<'PY'
          import os
          import re
          import smtplib
          import time
          from email.message import EmailMessage

          import pandas as pd
          import exchange_calendars as xcals
          from curl_cffi import requests


          TICKER = "QQQM"
          YAHOO_HOSTS = [
              "query1.finance.yahoo.com",
              "query2.finance.yahoo.com",
          ]
          MAX_FETCH_ATTEMPTS = 3
          RETRY_SECONDS = 20
          PRICE_DIFF_LIMIT = 0.002
          ACUTE_DROP_THRESHOLD = 0.10

          EMAIL_SENDER = os.environ.get("EMAIL_SENDER", "").strip()
          EMAIL_PASSWORD = os.environ.get("EMAIL_PASSWORD", "").strip()
          EMAIL_RECEIVERS_TEXT = os.environ.get("EMAIL_RECEIVERS", "").strip()
          TEST_EMAIL = os.environ.get("TEST_EMAIL", "false").lower() == "true"

          if not EMAIL_SENDER:
              raise RuntimeError("EMAIL_SENDER 未配置")
          if not EMAIL_PASSWORD:
              raise RuntimeError("EMAIL_PASSWORD 未配置")

          EMAIL_RECEIVERS = [
              x.strip() for x in EMAIL_RECEIVERS_TEXT.split(",") if x.strip()
          ]
          if not EMAIL_RECEIVERS:
              EMAIL_RECEIVERS = [EMAIL_SENDER]


          def send_email(subject, body):
              msg = EmailMessage()
              msg["Subject"] = subject
              msg["From"] = EMAIL_SENDER
              msg["To"] = ", ".join(EMAIL_RECEIVERS)
              msg.set_content(body)

              with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30) as server:
                  server.login(EMAIL_SENDER, EMAIL_PASSWORD)
                  server.send_message(msg)


          # ==========================================================
          # 邮箱测试模式
          # ==========================================================
          if TEST_EMAIL:
              print("==========================================")
              print("QQQM 自动监控")
              print("==========================================")
              print("🧪 当前模式：仅测试邮箱")
              print("本次不会检查QQQM，也不会产生投资信号。")

              send_email(
                  "QQQM自动监控：邮箱测试成功",
                  (
                      "这是一封QQQM自动监控测试邮件。\n\n"
                      "GitHub Actions → QQ邮箱 SMTP → 收件邮箱\n"
                      "通知链路正常。\n\n"
                      "本次运行仅测试邮箱，不会检查QQQM，也不会产生投资信号。"
                  ),
              )

              print("✅ 邮箱测试邮件发送成功")
              raise SystemExit(0)


          # ==========================================================
          # 1. 确定NYSE最近一个已经完整收盘的交易日
          # ==========================================================
          now_utc = pd.Timestamp.now(tz="UTC")
          nyse = xcals.get_calendar("XNYS")

          start_date = (now_utc - pd.Timedelta(days=15)).strftime("%Y-%m-%d")
          end_date = (now_utc + pd.Timedelta(days=1)).strftime("%Y-%m-%d")

          schedule = nyse.schedule.loc[start_date:end_date]
          if schedule.empty:
              raise RuntimeError("无法取得NYSE交易日历")

          close_column = "close" if "close" in schedule.columns else "market_close"
          completed_sessions = schedule[schedule[close_column] <= now_utc]

          if completed_sessions.empty:
              raise RuntimeError("当前没有已完成的NYSE交易时段")

          expected_session = completed_sessions.index[-1]
          expected_date = expected_session.strftime("%Y-%m-%d")

          # 上一个已完成交易日，用于识别“新月份第一根完整日线”
          previous_session = (
              completed_sessions.index[-2]
              if len(completed_sessions) >= 2
              else None
          )
          previous_session_date = (
              previous_session.strftime("%Y-%m-%d")
              if previous_session is not None
              else None
          )

          print("==========================================")
          print("QQQM 自动监控")
          print("==========================================")
          print(f"检查时间UTC：{now_utc.strftime('%Y-%m-%d %H:%M:%S')}")
          print(f"NYSE最新应有完整交易日：{expected_date}")
          print(f"上一交易日：{previous_session_date}")


          # ==========================================================
          # 2. Yahoo Finance Chart API
          #    同时读取 Open / High / Low / Close
          # ==========================================================
          def fetch_yahoo(host):
              url = f"https://{host}/v8/finance/chart/{TICKER}"
              params = {
                  "range": "15y",
                  "interval": "1d",
                  "events": "div,splits",
                  "includeAdjustedClose": "true",
              }

              session = requests.Session(impersonate="chrome")
              try:
                  response = session.get(url, params=params, timeout=30)
                  response.raise_for_status()
                  payload = response.json()

                  result = payload.get("chart", {}).get("result")
                  if not result:
                      raise RuntimeError("Yahoo返回结果为空")
                  result = result[0]

                  timestamps = result.get("timestamp", [])
                  quote_data = result.get("indicators", {}).get("quote", [])
                  if not timestamps or not quote_data:
                      raise RuntimeError("Yahoo行情数据结构异常")

                  quote = quote_data[0]
                  opens = quote.get("open", [])
                  highs = quote.get("high", [])
                  lows = quote.get("low", [])
                  closes = quote.get("close", [])

                  lengths = {len(timestamps), len(opens), len(highs), len(lows), len(closes)}
                  if len(lengths) != 1:
                      raise RuntimeError("Yahoo时间与OHLC长度不一致")

                  timezone_name = result.get("meta", {}).get(
                      "exchangeTimezoneName", "America/New_York"
                  )

                  rows = []
                  for ts, op, hi, lo, cl in zip(
                      timestamps, opens, highs, lows, closes
                  ):
                      if cl is None:
                          continue

                      dt = pd.Timestamp(ts, unit="s", tz="UTC").tz_convert(timezone_name)
                      rows.append(
                          {
                              "timestamp": dt,
                              "date": dt.strftime("%Y-%m-%d"),
                              "open": float(op) if op is not None else float("nan"),
                              "high": float(hi) if hi is not None else float("nan"),
                              "low": float(lo) if lo is not None else float("nan"),
                              "close": float(cl),
                          }
                      )

                  if not rows:
                      raise RuntimeError("Yahoo没有有效日线数据")

                  df = pd.DataFrame(rows)
                  df = df.drop_duplicates(subset=["date"], keep="last")
                  df = df.sort_values("timestamp").reset_index(drop=True)
                  return df
              finally:
                  session.close()


          # ==========================================================
          # 3. 双Yahoo入口读取；如果没有更新到应有交易日，自动重试
          # ==========================================================
          sources = {}
          last_error_text = []

          for attempt in range(1, MAX_FETCH_ATTEMPTS + 1):
              sources = {}
              last_error_text = []

              print("------------------------------------------")
              print(f"Yahoo数据读取：第 {attempt}/{MAX_FETCH_ATTEMPTS} 次")

              for host in YAHOO_HOSTS:
                  try:
                      print(f"正在获取数据：{host}")
                      data = fetch_yahoo(host)

                      # 严禁使用未来日期数据；仅保留NYSE最新完整交易日及之前的数据
                      data = data[data["date"] <= expected_date].copy()

                      if data.empty:
                          raise RuntimeError("没有不晚于应有交易日的数据")

                      latest_row = data.iloc[-1]
                      print(
                          f"{host} 可用最新交易日：{latest_row['date']}，"
                          f"收盘：{latest_row['close']:.2f}"
                      )
                      sources[host] = data

                  except Exception as exc:
                      last_error_text.append(f"{host}: {exc}")
                      print(f"⚠️ {host} 获取失败：{exc}")

              reached_expected = any(
                  not data.empty and data.iloc[-1]["date"] == expected_date
                  for data in sources.values()
              )

              if reached_expected:
                  break

              if attempt < MAX_FETCH_ATTEMPTS:
                  print(
                      f"⚠️ Yahoo历史接口尚未提供 {expected_date}，"
                      f"{RETRY_SECONDS} 秒后重试。"
                  )
                  time.sleep(RETRY_SECONDS)

          if not sources:
              body = (
                  "QQQM自动监控：行情数据获取失败\n\n"
                  f"检查时间UTC：{now_utc}\n"
                  f"NYSE最新应有交易日：{expected_date}\n\n"
                  "两个Yahoo入口均无法取得有效QQQM数据。\n\n"
                  + "\n".join(last_error_text)
                  + "\n\n本次没有产生任何投资信号。"
              )
              send_email("❌ QQQM自动监控：行情数据获取失败", body)
              raise RuntimeError("query1/query2均无法获取QQQM")


          # ==========================================================
          # 4. Yahoo历史接口滞后时，用独立历史网页补齐最新完整交易日
          # ==========================================================
          supplemental_source_used = False
          supplemental_source_name = None

          def fetch_stockanalysis_history():
              """
              从StockAnalysis页面的内嵌结构化数据中提取日线。

              不使用pd.read_html，因为该页面为Svelte动态页面，
              HTML表格解析在GitHub Actions上可能失败；页面源码本身
              已包含形如：
              {a:...,c:...,h:...,l:...,o:...,t:"YYYY-MM-DD",v:...}
              的历史数据对象。
              """

              url = "https://stockanalysis.com/etf/qqqm/history/"
              session = requests.Session(impersonate="chrome")

              number = r"-?(?:\d+(?:\.\d+)?|\.\d+)"
              pattern = re.compile(
                  rf'\{{a:(?P<a>{number}),c:(?P<c>{number}),h:(?P<h>{number}),l:(?P<l>{number}),o:(?P<o>{number}),t:"(?P<t>\d{{4}}-\d{{2}}-\d{{2}})"'
              )

              try:
                  response = session.get(url, timeout=30)
                  response.raise_for_status()
                  html = response.text

                  matches = list(pattern.finditer(html))

                  if not matches:
                      raise RuntimeError(
                          "StockAnalysis页面未找到内嵌QQQM历史数据"
                      )

                  rows = []
                  for match in matches:
                      rows.append(
                          {
                              "date": match.group("t"),
                              "open": float(match.group("o")),
                              "high": float(match.group("h")),
                              "low": float(match.group("l")),
                              "close": float(match.group("c")),
                          }
                      )

                  df = pd.DataFrame(rows)
                  df = df.drop_duplicates(subset=["date"], keep="last")
                  df = df.sort_values("date").reset_index(drop=True)
                  df = df[df["date"] <= expected_date].copy()

                  if df.empty:
                      raise RuntimeError(
                          "StockAnalysis没有不晚于应有交易日的数据"
                      )

                  print(
                      f"StockAnalysis共解析 {len(df)} 个有效交易日"
                  )

                  return df

              finally:
                  session.close()


          yahoo_latest_date = max(
              data.iloc[-1]["date"] for data in sources.values()
          )

          if yahoo_latest_date < expected_date:
              print("------------------------------------------")
              print(
                  f"⚠️ Yahoo历史接口最新到 {yahoo_latest_date}，"
                  f"目标交易日为 {expected_date}"
              )
              print("正在使用独立历史数据源补齐缺失日线。")

              try:
                  supplemental = fetch_stockanalysis_history()
                  supplemental_latest = supplemental.iloc[-1]

                  print(
                      f"StockAnalysis最新交易日：{supplemental_latest['date']}，"
                      f"收盘：{supplemental_latest['close']:.2f}"
                  )

                  if supplemental_latest["date"] != expected_date:
                      raise RuntimeError(
                          f"StockAnalysis也未更新到 {expected_date}"
                      )

                  # 用补充源的上一交易日与Yahoo进行连续性校验
                  previous_supp = supplemental[
                      supplemental["date"] < expected_date
                  ]
                  if previous_supp.empty:
                      raise RuntimeError("补充源缺少前一交易日数据")

                  supp_prev_row = previous_supp.iloc[-1]

                  yahoo_previous_rows = []
                  for host, data in sources.items():
                      prev = data[data["date"] < expected_date]
                      if not prev.empty:
                          yahoo_previous_rows.append(prev.iloc[-1])

                  if not yahoo_previous_rows:
                      raise RuntimeError("Yahoo缺少前一交易日数据，无法连续性校验")

                  yahoo_previous_row = max(
                      yahoo_previous_rows,
                      key=lambda row: row["date"]
                  )
                  yahoo_previous_close = float(yahoo_previous_row["close"])
                  supplemental_previous_close = float(supp_prev_row["close"])

                  continuity_difference = abs(
                      supplemental_previous_close - yahoo_previous_close
                  ) / yahoo_previous_close

                  print(
                      f"补充源前一交易日收盘：{supplemental_previous_close:.2f}"
                  )
                  print(
                      f"Yahoo前一交易日收盘：{yahoo_previous_close:.2f}"
                  )
                  print(
                      f"历史连续性差异：{continuity_difference * 100:.4f}%"
                  )

                  if continuity_difference > PRICE_DIFF_LIMIT:
                      raise RuntimeError(
                          "补充源与Yahoo前一交易日收盘不一致"
                      )

                  missing_rows = supplemental[
                      supplemental["date"] > yahoo_latest_date
                  ].copy()

                  if missing_rows.empty:
                      raise RuntimeError("没有可补齐的新交易日")

                  # 仅把Yahoo缺失的交易日附加进去；已有历史数据不替换
                  for host in list(sources.keys()):
                      combined = pd.concat(
                          [sources[host], missing_rows],
                          ignore_index=True,
                      )
                      combined = (
                          combined.drop_duplicates(subset=["date"], keep="last")
                          .sort_values("date")
                          .reset_index(drop=True)
                      )
                      sources[host] = combined

                  supplemental_source_used = True
                  supplemental_source_name = "StockAnalysis（S&P Global Market Intelligence数据）"
                  print(
                      "✅ 已补齐："
                      + ", ".join(missing_rows["date"].tolist())
                  )

              except Exception as exc:
                  body = (
                      "QQQM自动监控：Yahoo历史数据滞后，备用历史源补齐失败\n\n"
                      f"检查时间UTC：{now_utc}\n"
                      f"NYSE最新应有交易日：{expected_date}\n"
                      f"Yahoo最新：{yahoo_latest_date}\n"
                      f"错误：{exc}\n\n"
                      "为防止使用旧行情产生错误投资信号，本次监控停止。\n\n"
                      "请不要根据本次任务采取投资操作。"
                  )
                  send_email("⚠️ QQQM自动监控：行情数据补齐失败", body)
                  raise RuntimeError(
                      "无法取得最新完整交易日QQQM数据"
                  )


          # ==========================================================
          # 5. 选择数据源：必须已经更新到expected_date
          # ==========================================================
          expected_candidates = []
          for host, data in sources.items():
              row = data.iloc[-1]
              expected_candidates.append(
                  {
                      "host": host,
                      "date": row["date"],
                      "close": float(row["close"]),
                      "data": data,
                  }
              )

          reached = [
              x for x in expected_candidates
              if x["date"] == expected_date
          ]

          if not reached:
              latest_available = max(
                  expected_candidates,
                  key=lambda x: x["date"]
              )
              body = (
                  "QQQM自动监控：行情数据未更新到最新完整交易日\n\n"
                  f"检查时间UTC：{now_utc}\n"
                  f"NYSE最新应有交易日：{expected_date}\n"
                  f"程序实际最新取得：{latest_available['date']}\n"
                  f"QQQM价格：{latest_available['close']:.2f}\n\n"
                  "Yahoo及备用历史数据均未取得最新完整交易日。\n"
                  "为了防止旧行情产生错误投资信号，本次监控停止。\n\n"
                  "请不要根据本次任务采取投资操作。"
              )
              send_email("⚠️ QQQM自动监控：行情数据过期", body)
              raise RuntimeError("QQQM行情未更新到最新完整交易日")

          # 如果两个Yahoo入口均已更新，则优先选Yahoo；否则任选一个已补齐的源
          reached.sort(key=lambda x: x["host"])
          selected = reached[0]
          latest_date = selected["date"]
          latest_close = selected["close"]
          daily = selected["data"].copy()

          print("------------------------------------------")
          print(f"实际获取最新交易日：{latest_date}")
          print(f"NYSE最新应有交易日：{expected_date}")
          print(f"选用数据源基础：{selected['host']}")
          if supplemental_source_used:
              print(f"最新缺失日补充源：{supplemental_source_name}")
          print(f"QQQM最新收盘：{latest_close:.2f}")


          # ==========================================================
          # 6. Yahoo双入口交叉检查
          #    若两入口在最新日都已更新，则检查最新日价格；若二者都滞后，
          #    则前一交易日连续性已经完成交叉校验，不把同一补充源重复算作双源。
          # ==========================================================
          yahoo_latest_candidates = []
          for host, data in sources.items():
              row = data.iloc[-1]
              # 只有真正从Yahoo拿到expected_date的，才计入“Yahoo最新日”交叉检查
              if not supplemental_source_used or yahoo_latest_date == expected_date:
                  yahoo_latest_candidates.append(float(row["close"]))

          if len(yahoo_latest_candidates) >= 2 and yahoo_latest_date == expected_date:
              p1, p2 = yahoo_latest_candidates[:2]
              difference = abs(p1 - p2) / p1
              print(f"Yahoo双入口最新日价格差：{difference * 100:.4f}%")

              if difference > PRICE_DIFF_LIMIT:
                  body = (
                      "QQQM自动监控：两个Yahoo行情入口最新收盘不一致\n\n"
                      f"交易日：{latest_date}\n"
                      f"价格1：{p1:.4f}\n"
                      f"价格2：{p2:.4f}\n"
                      f"差异：{difference * 100:.4f}%\n\n"
                      "为了避免错误信号，本次监控已经停止。"
                  )
                  send_email("⚠️ QQQM自动监控：Yahoo行情源不一致", body)
                  raise RuntimeError("Yahoo双入口价格不一致")
          else:
              print("ℹ️ Yahoo两个历史入口均滞后，本次采用‘Yahoo前一交易日连续性 + 独立历史源补齐’校验。")
          # ==========================================================
          # 6. 计算完整月线
          # ==========================================================
          daily["month"] = pd.to_datetime(daily["date"]).dt.to_period("M")

          monthly = (
              daily.groupby("month")
              .agg(
                  Open=("open", "first"),
                  High=("high", "max"),
                  Low=("low", "min"),
                  Close=("close", "last"),
              )
              .sort_index()
          )

          # 当前月份尚未完成，绝不能进入M5/M10/M20/M30/M60计算
          current_month = pd.Timestamp.now(tz="Asia/Shanghai").tz_localize(None).to_period("M")
          monthly = monthly[monthly.index < current_month].copy()

          if len(monthly) < 60:
              raise RuntimeError("有效月线数据不足60个月")

          for n in [5, 10, 20, 30, 60]:
              monthly[f"M{n}"] = monthly["Close"].rolling(n).mean()

          latest_month = monthly.index[-1]
          latest_month_row = monthly.loc[latest_month]

          print("==========================================")
          print("QQQM 最新有效月线")
          print("==========================================")
          print(f"最新完整月份：{latest_month}")
          print(f"月收盘：{latest_month_row['Close']:.2f}")

          for n in [5, 10, 20, 30, 60]:
              value = latest_month_row[f"M{n}"]
              print(f"M{n}：{value:.2f}")

          # ==========================================================
          # 7. 破线状态：最新完整月收盘是否低于各月线
          # ==========================================================
          print("------------------------------------------")
          print("破线状态")

          line_breaks = {}
          for n in [5, 10, 20, 30, 60]:
              ma = float(latest_month_row[f"M{n}"])
              close = float(latest_month_row["Close"])
              broken = close < ma
              line_breaks[n] = broken
              gap = close / ma - 1
              state = "🔴 已破线" if broken else "🟢 未破线"
              print(f"M{n}：{state}，相对均线 {gap * 100:.2f}%")


          # ==========================================================
          # 8. 判断“新月份第一根完整日线”
          #    这样每天运行不会因同一月线状态重复报警。
          # ==========================================================
          is_new_completed_month = False
          if previous_session is not None:
              latest_session_month = expected_session.strftime("%Y-%m")
              previous_session_month = previous_session.strftime("%Y-%m")
              is_new_completed_month = (
                  latest_session_month != previous_session_month
              )

          print("------------------------------------------")
          print(
              "新月份第一根完整日线："
              f"{'是' if is_new_completed_month else '否'}"
          )


          # ==========================================================
          # 9. 月中急跌监控（按你已调整为10%的触发阈值）
          #    使用每日最低价，而不是收盘价；因此盘中曾经跌到阈值，
          #    即使收盘反弹，也不会被日线监控漏掉。
          # ==========================================================
          daily["session_month"] = pd.to_datetime(daily["date"]).dt.to_period("M")

          current_session_month = pd.Period(expected_date, freq="M")
          current_month_daily = daily[
              daily["session_month"] == current_session_month
          ].copy()

          acute_drop_triggered = False
          acute_drop_date = None
          acute_drop_low = None
          acute_drop_from_open = None

          if not current_month_daily.empty:
              first_open = float(current_month_daily.iloc[0]["open"])
              threshold_price = first_open * (1 - ACUTE_DROP_THRESHOLD)

              below = current_month_daily["low"] <= threshold_price
              triggered_rows = current_month_daily[below]

              if not triggered_rows.empty:
                  row = triggered_rows.iloc[0]
                  acute_drop_triggered = True
                  acute_drop_date = row["date"]
                  acute_drop_low = float(row["low"])
                  acute_drop_from_open = acute_drop_low / first_open - 1

              print("------------------------------------------")
              print(f"本月第一交易日开盘价：{first_open:.2f}")
              print(f"10%急跌触发价：{threshold_price:.2f}")
              if acute_drop_triggered:
                  print(
                      f"🔴 月中急跌已触发：{acute_drop_date}，"
                      f"最低 {acute_drop_low:.2f}，"
                      f"相对月初开盘 {acute_drop_from_open * 100:.2f}%"
                  )
              else:
                  print("🟢 本月尚未触发10%急跌")


          # ==========================================================
          # 10. 最终输出
          # ==========================================================
          print("==========================================")
          print("✅ 行情数据新鲜度检查通过")
          print("✅ 两个Yahoo入口交叉检查通过")
          print("✅ 月线M5/M10/M20/M30/M60计算完成")
          print("✅ 破线状态计算完成")
          print("✅ 10%月中急跌条件计算完成")
          print("==========================================")

          # 注意：这里故意不擅自写入最终V5.6买入金额。
          # 你当前贴出的YAML只包含行情与均线监控，没有包含你最终确认的
          # V5.6“各破线档位具体买入金额”文本。
          # 先把数据层固定，避免把2022年12月那类金额错配重新写进自动化。

          signal_lines = [
              f"检查交易日：{latest_date}",
              f"QQQM收盘：{latest_close:.2f}",
              f"最新完整月：{latest_month}",
          ]

          for n in [5, 10, 20, 30, 60]:
              signal_lines.append(
                  f"M{n}: {'破线' if line_breaks[n] else '未破线'}"
              )

          if acute_drop_triggered:
              signal_lines.append(
                  f"10%急跌：已触发（{acute_drop_date}，最低{acute_drop_low:.2f}）"
              )
          else:
              signal_lines.append("10%急跌：未触发")

          if is_new_completed_month:
              signal_lines.append("本次属于新月份首个完整交易日后的检查窗口")

          report_body = "\n".join(signal_lines)

          report_body += "\n\n均线数值："
          for n in [5, 10, 20, 30, 60]:
              report_body += f"\nM{n}：{float(latest_month_row[f'M{n}']):.2f}"

          report_body += "\n\n数据来源："
          if supplemental_source_used:
              report_body += "\nYahoo历史接口滞后，本次使用StockAnalysis历史数据补齐最新交易日。"
          else:
              report_body += "\nYahoo历史接口已取得最新完整交易日。"

          report_body += "\n\n当前版本说明："
          report_body += "\n本邮件为QQQM行情与破线监控报告。正式V5.6各档买入金额尚未写入自动化，不应仅依据本邮件直接下单。"

          print("\n".join(signal_lines))

          # ==========================================================
          # 11. 正常运行也发送监控结果邮件
          # ==========================================================
          if acute_drop_triggered or any(line_breaks.values()):
              subject = f"⚠️ QQQM自动监控：{latest_date}检测到条件"
          else:
              subject = f"✅ QQQM自动监控：{latest_date}正常"

          send_email(subject, report_body)
          print("✅ 正常监控结果邮件发送成功")

          PY
